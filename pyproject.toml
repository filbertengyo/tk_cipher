[project]
name = "tk-cipher"
version = "0.1.0"
description = "TK-Cipher: a custom 128-bit SPN block cipher with a file encryption CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tk-cipher = "tk_cipher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tk_cipher"]

[dependency-groups]
dev = ["pytest", "pdoc", "pyinstaller", "ruff"]
analysis = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that take a long time (large files, many samples)",
]

[tool.ruff]
include = ["*.py"]

[tool.ruff.lint]
extend-select = ["I"]
